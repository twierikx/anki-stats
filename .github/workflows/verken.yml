name: Verkenning (eenmalig)

on:
  workflow_dispatch:

jobs:
  verken:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python verken.py
        env:
          ANKI_ACCOUNTS: ${{ secrets.ANKI_ACCOUNTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
